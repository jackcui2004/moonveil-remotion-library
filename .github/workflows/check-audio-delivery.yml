name: AAC delivery regression
on:
  push:
    paths: ['workflow/tools/**', 'workflow/tests/**', '.github/workflows/check-audio-delivery.yml']
  pull_request:
    paths: ['workflow/tools/**', 'workflow/tests/**', '.github/workflows/check-audio-delivery.yml']
permissions:
  contents: read
jobs:
  real-media-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s workflow/tests -v
