name: Check paper cutout workflow
on:
  push:
    paths: ['paper-cutout/**', 'workflow/README.md', 'workflow/build_page.py', 'workflow/index.html', '.github/workflows/check-paper-cutout.yml']
  pull_request:
    paths: ['paper-cutout/**', 'workflow/README.md', 'workflow/build_page.py', 'workflow/index.html', '.github/workflows/check-paper-cutout.yml']
jobs:
  tools-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s paper-cutout/tests -v
      - run: python workflow/build_page.py
      - run: git diff --exit-code -- workflow/index.html
